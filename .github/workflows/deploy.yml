name: Deploy (FTP)

on:
    push:
        branches:
            - main

jobs:
    ftp-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install Dependencies
              run: composer install --no-dev --optimize-autoloader

            - name: FTP Deploy
              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.FTP_SERVER }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  # Pasta do site no FTP: /htdocs/ no InfinityFree, /public_html/ na HostGator.
                  # Vem do secret FTP_SERVER_DIR; sem ele, continua /htdocs/.
                  server-dir: ${{ secrets.FTP_SERVER_DIR || '/htdocs/' }}
                  exclude: |
                      **/.git*
                      **/.git*/**
                      **/node_modules/**
                      config.php
                      .env
                      logs/**
                      tests/**